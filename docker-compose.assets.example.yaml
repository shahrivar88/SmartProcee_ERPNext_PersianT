# Use this only for frappe_docker deployments whose frontend container has a
# container-local /home/frappe/frappe-bench/assets directory.
services:
  frontend:
    volumes:
      - "${SMARTPROCEE_ERPNEXT_PERSIANT_PATH}/smartprocee_erpnext_persiant/public:/home/frappe/frappe-bench/assets/smartprocee_erpnext_persiant:ro"
