[project]
name = "smartprocee_erpnext_persiant"
authors = [
    { name = "Smart Process" }
]
description = "Persian translation, font, and RTL management for Frappe and ERPNext"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
dynamic = ["version"]
dependencies = [
    "openpyxl>=3.1",
    "fonttools>=4.50",
    "brotli>=1.1",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
