[project]
name = "smartprocee_erpnext_persiant"
authors = [
    { name = "Smart Process", email = "info@smartprocess.local" }
]
description = "Portable Persian translations and Yekan Bakh UI font for Frappe and ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "openpyxl>=3.1",
    "fonttools>=4.50",
    "brotli>=1.1",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
